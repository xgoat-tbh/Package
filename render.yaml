services:
  - type: web
    name: syspy-installer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python controller.py --host 0.0.0.0 --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SYSPY_MODE
        value: "controller"
      - key: SYSPY_HOST
        value: 0.0.0.0
      - key: SYSPY_TRUST_PROXY_HOPS
        value: "1"
      - key: SYSPY_URL                # Controller VPS Base URL: e.g. https://dashboard.yourdomain.com
        sync: false
      - key: SYSPY_ROOM               # Must match VPS SYSPY_ROOM
        sync: false
      - key: SYSPY_PASS               # Must match VPS SYSPY_PASS
        sync: false
      - key: SYSPY_SIGN_KEY           # Controller signing key (optional on installer if PUBKEY is set)
        sync: false
      - key: SYSPY_PUBKEY             # Matching public key hex to pin on fleet
        sync: false
