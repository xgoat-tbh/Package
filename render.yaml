services:
  - type: web
    name: syspy-controller
    runtime: python
    plan: free
    region: oregon
    buildCommand: "python -m compileall -q syspy || true"
    startCommand: "python controller.py --host 0.0.0.0 --port $PORT --no-browser"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SYSPY_PASSWORD
        generateValue: true
      - key: SYSPY_ROOM
        value: syspy-CHANGEME-9f31
      - key: SYSPY_PASS
        value: CHANGEME-long-random-passphrase
      - key: SYSPY_URL
        sync: false            # set to https://<app>.onrender.com after first deploy
      - key: SYSPY_DATA
        value: /opt/render/project/src/data
      - key: SYSPY_PROTECTED
        value: "1"
